@if (!isVotingClosed()) {
  <div class="voting-feature">
    <div class="input-wrapper">
      <label>
        <input
          type="radio"
          name="mode"
          value="single"
          (change)="switchVotingMode('single')"
          [checked]="votingMode === 'single'"
          [disabled]="isVotingClosed()"
        />
        Single Vote
      </label>
      <label>
        <input
          type="radio"
          name="mode"
          value="multiple"
          (change)="switchVotingMode('multiple')"
          [checked]="votingMode === 'multiple'"
          [disabled]="isVotingClosed()"
        />
        Multiple Votes
      </label>
    </div>

    <div class="voting-form">
      <h3>Time left: {{ countdown() }} seconds</h3>

      @if (imageUrl()) {
        <img [src]="imageUrl()" alt="Random" class="voting-image" />
      }

      <label for="number">Enter a value from <b>1 - 10</b></label>
      <input
        name="number"
        type="number"
        #voteInput
        min="1"
        max="10"
        placeholder="Enter your vote"
        class="vote-input"
        [disabled]="isVotingClosed()"
      />
      <button
        class="vote-button"
        (click)="submitVote(voteInput.valueAsNumber)"
        [disabled]="votingMode === 'single' && votes.length > 0"
      >
        Send Vote!
      </button>

      @if (votes().length > 0) {
        <h3>Average Vote: {{ getAverageVote() }}</h3>
      }
    </div>
  </div>
} @else {
  <div>
    <h3>The voting has ended!</h3>
  </div>
}
